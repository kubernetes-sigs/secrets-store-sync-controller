version: "2"
run:
  go: "1.26"
linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    goconst:
      ignore-tests: true
    gocritic:
      enabled-tags:
        - performance
    lll:
      line-length: 200
    staticcheck:
      checks:
        - all
        - "-QF1008" # disables 'Omit embedded fields from selector expression.'
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Credential-shaped values in tests are fixtures, not live credentials.
      - path: ^pkg/(token/token_manager_test|util/secretutil/secret_test)\.go$
        linters:
          - gosec
        text: "G101:"
      # The comparison helper checks that both slices have equal lengths first.
      - path: ^pkg/controller/secretsync_controller_test\.go$
        linters:
          - gosec
        text: "G602:"
        source: 'condB := b\[i\]\.DeepCopy\(\)'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: error
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

name: "govulncheck"

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
    - cron: "0 7 * * 1" # Mondays at 7:00 AM

permissions:
  contents: read

jobs:
  govulncheck:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Golang vulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.0.4
        with:
          repo-checkout: false

      - name: Golang vulncheck - tools
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.0.4
        with:
          repo-checkout: false
          work-dir: hack/tools
